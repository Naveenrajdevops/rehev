version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rehabai-postgres
    environment:
      POSTGRES_USER: rehabai_user
      POSTGRES_PASSWORD: rehabai_secret_password
      POSTGRES_DB: rehabai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehabai_user -d rehabai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rehabai-backend
    environment:
      DATABASE_URL: postgresql://rehabai_user:rehabai_secret_password@postgres:5432/rehabai_db
      JWT_SECRET: rehabai-pro-super-secret-key-2026-production
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: gemini-2.5-flash
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rehabai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
